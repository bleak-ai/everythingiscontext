[project]
name = "gcontext-ai"
version = "1.0.1"
description = "A standard for a context/ folder in your repo, plus a small CLI."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "bleak-ai" }]
requires-python = ">=3.11"
keywords = ["mcp", "agents", "ai", "state", "context"]
dependencies = [
    "fastmcp>=2.0.0",
    "pyyaml>=6.0",
    "certifi",
]

[project.urls]
Homepage = "https://github.com/bleak-ai/gcontext"
Repository = "https://github.com/bleak-ai/gcontext"

[project.scripts]
gcontext = "gcontext.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gcontext"]
artifacts = ["gcontext/standard/**"]

[tool.hatch.build.targets.sdist]
only-include = ["gcontext", "docs", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
