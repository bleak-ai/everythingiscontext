name: demo-brief
description: Dummy flow to exercise v4 reactive state. Capture a brief, draft from it, then finalize.
steps:
  - id: capture
    description: Capture what the user wants covered
    produces:
      - flows/demo-brief/brief.md
    instructions: |
      Ask the user what they want a short write-up about: topic, audience,
      and the three points that must appear. Write their answers to
      flows/demo-brief/brief.md as a short markdown brief.

  - id: draft
    description: Draft the write-up from the brief
    needs:
      - flows/demo-brief/brief.md
    produces:
      - flows/demo-brief/draft.md
    instructions: |
      Read flows/demo-brief/brief.md and write a first draft (150-250 words)
      to flows/demo-brief/draft.md. Cover every point in the brief.

  - id: finalize
    description: Polish the draft into the final version
    needs:
      - flows/demo-brief/brief.md
      - flows/demo-brief/draft.md
    produces:
      - flows/demo-brief/final.md
    instructions: |
      Read the brief and the draft, tighten the language, and write the final
      version to flows/demo-brief/final.md. If the brief changed since the
      draft was written, this step shows as stale: redo it from the current brief.
